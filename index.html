<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6d5dfc">
<title>Mero QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Sora:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ff;--card:rgba(255,255,255,.75);--tx:#14122b;--mu:#6c6a85;--ac:#6d5dfc;--ac2:#ff5da2;--bd:rgba(109,93,252,.18);--sh:0 10px 30px rgba(80,60,200,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0d1a;--card:rgba(30,28,52,.7);--tx:#f1f0ff;--mu:#a09eca;--ac:#8d80ff;--ac2:#ff6fb0;--bd:rgba(141,128,255,.22);--sh:0 10px 30px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px 'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;
 background:radial-gradient(600px 400px at 10% -5%,rgba(109,93,252,.28),transparent 70%),radial-gradient(500px 400px at 100% 10%,rgba(255,93,162,.22),transparent 70%),var(--bg);background-attachment:fixed}
main{max-width:560px;margin:0 auto;padding:26px 16px 50px;transition:max-width .4s}
.direct main{max-width:920px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:22px;animation:up .6s both}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;box-shadow:0 8px 20px rgba(109,93,252,.4)}
.logo i{display:grid;grid-template:repeat(3,7px)/repeat(3,7px);gap:2px}
.logo b{background:#fff;border-radius:2px}.logo b:nth-child(even){opacity:.35}
h1{font:800 24px 'Sora',sans-serif;margin:0;letter-spacing:-.5px}
.s{color:var(--mu);margin:2px 0 0;font-size:14px}
.wrap{display:block}
.direct .wrap{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.list{display:grid;gap:10px}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:16px;color:var(--tx);font:600 16px inherit;cursor:pointer;text-align:left;box-shadow:var(--sh);transition:transform .2s,border-color .2s,box-shadow .2s;animation:up .5s both}
.item:hover{transform:translateY(-2px);border-color:var(--ac)}
.item:active{transform:scale(.98)}
.item.active{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac),var(--sh)}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 17px 'Sora',sans-serif;flex:none}
.item b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item i{font-style:normal;color:var(--mu);font-size:22px;transition:transform .2s}
.item:hover i{transform:translateX(4px);color:var(--ac)}
.direct .item i{display:none}
.sk{height:68px;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--bd) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.empty{color:var(--mu);text-align:center;padding:30px 0}
.side{display:none;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:24px;padding:22px;text-align:center;box-shadow:var(--sh)}
.direct .side{display:block}
#qv h3{margin:0 0 14px;font:800 20px 'Sora',sans-serif}
.frame{position:relative;display:inline-block;width:100%;max-width:340px;padding:16px;overflow:hidden;border-radius:18px;
 background:linear-gradient(var(--ac),var(--ac)) 0 0/28px 4px,linear-gradient(var(--ac),var(--ac)) 0 0/4px 28px,linear-gradient(var(--ac),var(--ac)) 100% 0/28px 4px,linear-gradient(var(--ac),var(--ac)) 100% 0/4px 28px,linear-gradient(var(--ac),var(--ac)) 0 100%/28px 4px,linear-gradient(var(--ac),var(--ac)) 0 100%/4px 28px,linear-gradient(var(--ac),var(--ac)) 100% 100%/28px 4px,linear-gradient(var(--ac),var(--ac)) 100% 100%/4px 28px;background-repeat:no-repeat}
.frame::after{content:"";position:absolute;left:12px;right:12px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--ac2),transparent);box-shadow:0 0 14px var(--ac2);animation:scan 2.6s ease-in-out infinite}
.direct .frame{max-width:380px}
#mi{display:block;width:100%;background:#fff;border-radius:10px;opacity:0;transform:scale(.92);transition:opacity .45s,transform .45s cubic-bezier(.2,.9,.3,1.2)}
#mi.in{opacity:1;transform:none}
.hint{color:var(--mu);font-size:13px;margin-top:12px}
.panel{margin-top:20px;padding:18px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--bd);border-radius:20px;display:grid;gap:12px;box-shadow:var(--sh);animation:up .4s both}
.panel h2{margin:0;font:800 16px 'Sora',sans-serif}
.tg{display:flex;align-items:center;gap:10px;font-size:15px}
.tg input{width:20px;height:20px;accent-color:var(--ac)}
input[type=text]{padding:13px 14px;border:1px solid var(--bd);border-radius:12px;background:transparent;color:var(--tx);font:inherit;width:100%}
input[type=text]:focus{outline:2px solid var(--ac);border-color:transparent}
input[type=file]{font-size:14px;color:var(--mu);max-width:100%}
button.p{padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font:700 16px inherit;cursor:pointer;box-shadow:0 8px 20px rgba(109,93,252,.35);transition:transform .15s}
button.p:active{transform:scale(.97)}button.p:disabled{opacity:.6}
.lnk{background:none;border:0;color:var(--mu);font:inherit;font-size:13px;cursor:pointer;margin-top:22px;text-decoration:underline;padding:0}
.modal{position:fixed;inset:0;background:rgba(10,8,30,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex;animation:fade .25s both}
.box{background:var(--bg);border:1px solid var(--bd);border-radius:26px;padding:22px;max-width:420px;width:100%;text-align:center;max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.modal.on .box{animation:pop .45s cubic-bezier(.2,1.1,.3,1) both}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row button{flex:1;min-width:90px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:600 15px inherit;cursor:pointer;transition:transform .15s}
.row button:active{transform:scale(.96)}.row button:disabled{opacity:.6}
.row .d,.row .r{display:none}.row .d{color:#e5484d}.row .r{color:var(--ac)}
.edit .row .d,.edit .row .r{display:block}
.direct #close{display:none}
.hide{display:none!important}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:22px;background:var(--bg);transition:opacity .6s,visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
.ld{display:grid;grid-template:repeat(3,18px)/repeat(3,18px);gap:6px}
.ld b{border-radius:5px;background:linear-gradient(135deg,var(--ac),var(--ac2));animation:blk 1.2s infinite ease-in-out both}
.ld b:nth-child(1){animation-delay:0s}.ld b:nth-child(2){animation-delay:.1s}.ld b:nth-child(3){animation-delay:.2s}
.ld b:nth-child(4){animation-delay:.1s}.ld b:nth-child(5){animation-delay:.2s}.ld b:nth-child(6){animation-delay:.3s}
.ld b:nth-child(7){animation-delay:.2s}.ld b:nth-child(8){animation-delay:.3s}.ld b:nth-child(9){animation-delay:.4s}
#splash p{font:800 22px 'Sora',sans-serif;margin:0;letter-spacing:-.3px}
@keyframes blk{0%,70%,100%{transform:scale(1);opacity:1}35%{transform:scale(.3);opacity:.3}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.88)}to{opacity:1;transform:none}}
@keyframes scan{0%,100%{top:12px;opacity:0}15%,85%{opacity:1}50%{top:calc(100% - 15px)}}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:680px){
 .direct .wrap{grid-template-columns:1fr}
 .direct .list{display:flex;overflow-x:auto;gap:8px;padding:4px 2px 10px;scrollbar-width:none}
 .direct .item{width:auto;flex:none;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="splash"><div class="ld"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div><p>Mero QR</p></div>

<main>
  <div class="hd">
    <div class="logo"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></div>
    <div><h1>Mero QR</h1><p class="s" id="sub">Scan garera pay garnus</p></div>
  </div>

  <div class="wrap">
    <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="side" id="side">
      <div id="qv" class="hide">
        <h3 id="mt"></h3>
        <div class="frame"><img id="mi" alt="QR"></div>
        <div class="hint">Camera le scan garnus</div>
        <div class="row">
          <button id="close">Banda</button>
          <button class="r" id="rep">Pic replace</button>
          <button class="d" id="del">Delete</button>
        </div>
        <input type="file" id="repfile" accept="image/*" class="hide">
      </div>
    </div>
  </div>

  <div class="panel hide" id="setp">
    <h2>Display setting</h2>
    <label class="tg"><input type="checkbox" id="dmode"> Direct dekhaune (QR sidai side ma, popup bina)</label>
  </div>

  <div class="panel hide" id="addp">
    <h2>Naya QR thapnus</h2>
    <input type="text" id="name" list="sug" placeholder="Name (jastai: eSewa, Nabil Bank)">
    <datalist id="sug"><option>eSewa</option><option>Khalti</option><option>IME Pay</option><option>Fonepay</option><option>Nabil Bank</option><option>NIC Asia</option><option>Global IME Bank</option></datalist>
    <input type="file" id="file" accept="image/*">
    <button class="p" id="save">Save garnus</button>
  </div>

  <button class="lnk" id="toggle">Edit (passcode)</button>
</main>

<div class="modal" id="modal"><div class="box" id="boxslot"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://pkbdygfdkeplutnzqjvx.supabase.co';
const SUPABASE_KEY='sb_publishable_tXcS8w9cY6TozitgxxswmA_tPkKXf1p';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let items=[],cur=null,pin=null,mode='popup';
const pub=p=>sb.storage.from('qrs').getPublicUrl(p).data.publicUrl;
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

async function loadMode(){
  const {data}=await sb.rpc('get_view_mode');
  if(data==='direct'||data==='popup')mode=data;
  $('dmode').checked=mode==='direct';
}
async function load(){
  const {data,error}=await sb.from('qrs').select('*').order('created_at');
  if(error){$('list').innerHTML='<div class="empty">Load garna sakiyena: '+error.message+'</div>';return}
  items=data;
  if(cur)cur=items.find(i=>i.id===cur.id)||null;
  render();
}
function showQr(){
  const direct=mode==='direct',img=$('mi');
  $('mt').textContent=cur.name;
  img.classList.remove('in');
  img.onload=()=>img.classList.add('in');
  img.src=pub(cur.path);
  $('qv').classList.remove('hide');
  (direct?$('side'):$('boxslot')).appendChild($('qv'));
  if(!direct)$('modal').classList.add('on');
}
function render(){
  const direct=mode==='direct';
  document.body.classList.toggle('direct',direct);
  $('sub').textContent=direct?'Left bata chhannus, QR sidai dekhinchha':'Scan garera pay garnus';
  const l=$('list');l.innerHTML='';
  if(direct){if(!cur&&items.length)cur=items[0];$('side').appendChild($('qv'))}
  if(!items.length){l.innerHTML='<div class="empty">Kei QR chhaina.</div>';$('qv').classList.add('hide');return}
  items.forEach((it,i)=>{
    const b=document.createElement('button');
    b.className='item'+(direct&&cur&&cur.id===it.id?' active':'');
    b.style.animationDelay=(i*60)+'ms';
    const h=hue(it.name);
    b.innerHTML='<div class="av"></div><b></b><i>›</i>';
    const av=b.firstChild;av.textContent=(it.name[0]||'?').toUpperCase();
    av.style.background='linear-gradient(135deg,hsl('+h+',80%,58%),hsl('+((h+40)%360)+',80%,50%))';
    b.children[1].textContent=it.name;
    b.onclick=()=>{cur=it;if(direct){render();}else showQr()};
    l.appendChild(b);
  });
  if(direct&&cur)showQr();else if(direct)$('qv').classList.add('hide');
}
function setEdit(on){
  $('addp').classList.toggle('hide',!on);
  $('setp').classList.toggle('hide',!on);
  document.body.classList.toggle('edit',on);
  $('toggle').textContent=on?'Edit band garnus':'Edit (passcode)';
  if(!on)pin=null;
}
$('toggle').onclick=async()=>{
  if(pin){setEdit(false);return}
  const p=prompt('Passcode halnus:');
  if(!p)return;
  const {data,error}=await sb.rpc('check_pin',{p_pin:p});
  if(error){alert('Error: '+error.message);return}
  if(!data){alert('Passcode galat chha.');return}
  pin=p;setEdit(true);
};
$('dmode').onchange=async()=>{
  const want=$('dmode').checked?'direct':'popup';
  const {error}=await sb.rpc('set_view_mode',{p_pin:pin,p_mode:want});
  if(error){alert(error.message);$('dmode').checked=mode==='direct';return}
  mode=want;cur=null;$('modal').classList.remove('on');render();
};
$('close').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};
$('del').onclick=async()=>{
  if(!cur||!pin||!confirm('Delete garne?'))return;
  const {error}=await sb.rpc('delete_qr',{p_pin:pin,p_id:cur.id});
  if(error){alert(error.message);return}
  cur=null;$('modal').classList.remove('on');load();
};
function shrink(file){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('Image convert bhayena')),'image/jpeg',.9);
    };
    im.onerror=()=>rej(new Error('Image padhna sakiyena'));
    im.src=URL.createObjectURL(file);
  });
}
async function uploadImg(file){
  const blob=await shrink(file),path=crypto.randomUUID()+'.jpg';
  const r=await sb.storage.from('qrs').upload(path,blob,{contentType:'image/jpeg'});
  if(r.error)throw r.error;
  return path;
}
$('save').onclick=async()=>{
  const n=$('name').value.trim(),f=$('file').files[0];
  if(!pin){alert('Pahile passcode halnus.');return}
  if(!n||!f){alert('Name ra QR image duitai chahinchha.');return}
  const btn=$('save');btn.disabled=true;btn.textContent='Upload hudai chha...';
  try{
    const path=await uploadImg(f);
    const r=await sb.rpc('add_qr',{p_pin:pin,p_name:n,p_path:path});
    if(r.error)throw r.error;
    $('name').value='';$('file').value='';load();
  }catch(e){alert('Error: '+e.message)}
  btn.disabled=false;btn.textContent='Save garnus';
};
$('rep').onclick=()=>{if(pin&&cur)$('repfile').click()};
$('repfile').onchange=async()=>{
  const f=$('repfile').files[0];$('repfile').value='';
  if(!f||!pin||!cur)return;
  const btn=$('rep');btn.disabled=true;btn.textContent='Upload hudai chha...';
  try{
    const path=await uploadImg(f);
    const r=await sb.rpc('replace_qr',{p_pin:pin,p_id:cur.id,p_path:path});
    if(r.error)throw r.error;
    cur.path=path;load();
  }catch(e){alert('Error: '+e.message)}
  btn.disabled=false;btn.textContent='Pic replace';
};
(async()=>{
  const wait=new Promise(r=>setTimeout(r,1100));
  await Promise.all([loadMode().then(load),wait]);
  $('splash').classList.add('gone');
})();
</script>
</body>
</html>
