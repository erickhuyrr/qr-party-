<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>Mero QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--tx:#f4f4f6;--mu:#9a9aab;--ln:rgba(255,255,255,.13);--gl:rgba(255,255,255,.06);--ac:#c8ff3d;--ink:#0b0b0f;--ga:#7b5cff;--gb:#ff3d81}
@media (prefers-color-scheme:light){:root{--bg:#f3f1ff;--tx:#12101f;--mu:#6a6784;--ln:rgba(20,16,50,.14);--gl:rgba(255,255,255,.6)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px 'DM Sans',system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;z-index:60;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:65vmax;height:65vmax;border-radius:50%;filter:blur(90px);opacity:.42;transition:background-color 1s;animation:drift 18s ease-in-out infinite alternate}
.bg i:nth-child(1){left:-25vmax;top:-25vmax;background:var(--ga)}
.bg i:nth-child(2){right:-25vmax;bottom:-25vmax;background:var(--gb);animation-delay:-6s}
.bg i:nth-child(3){left:30%;top:35%;width:35vmax;height:35vmax;background:#3dffd0;opacity:.16;animation-delay:-11s}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(var(--ln) 1px,transparent 1px) 0 0/22px 22px;mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 25%,#000,transparent 75%)}
main{max-width:560px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 60px;transition:max-width .5s}
.direct main{max-width:980px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:20px;animation:pop .6s both}
.logo{width:44px;height:44px;border-radius:15px;border:1.5px solid var(--ln);background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-content:center;box-shadow:0 0 24px -4px var(--ga)}
.logo i{display:grid;grid-template:repeat(3,8px)/repeat(3,8px);gap:2px}
.logo b{border-radius:2.5px;background:linear-gradient(135deg,#c8ff3d,#ff3d81)}
.logo b:nth-child(2),.logo b:nth-child(4),.logo b:nth-child(8){opacity:.3}.logo b:nth-child(5){background:#7b5cff}
.bw{font:800 20px 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}
.tag{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--ln);border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);background:var(--gl)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:#3dffa0;animation:pulse 1.6s infinite}
h1{font:800 clamp(46px,13vw,84px)/.92 'Bricolage Grotesque',sans-serif;letter-spacing:-.045em;margin:4px 0 12px}
h1 span{display:block;overflow:hidden;padding-bottom:.06em}
h1 em{display:block;font-style:normal;animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
h1 span:nth-child(2) em{animation-delay:.12s}
h1 u{text-decoration:none;background:linear-gradient(120deg,#c8ff3d,#ff3d81);-webkit-background-clip:text;background-clip:text;color:transparent}
.s{color:var(--mu);margin:0 0 18px;max-width:36ch}
.mq{display:flex;overflow:hidden;margin:0 -16px 22px;border-block:1px solid var(--ln);padding:11px 0;font:700 12px 'DM Sans';letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.mq div{flex:none;animation:mq 26s linear infinite}
.wrap{display:block}
.direct .wrap{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.direct .list{grid-template-columns:1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1.02;padding:15px;border-radius:30px;text-align:left;cursor:pointer;font:inherit;color:var(--tx);
 background:linear-gradient(145deg,color-mix(in srgb,var(--a) 30%,transparent),color-mix(in srgb,var(--b) 10%,transparent));
 border:1px solid color-mix(in srgb,var(--a) 50%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
 box-shadow:0 12px 30px -14px var(--a);animation:pop .6s cubic-bezier(.2,1.1,.3,1) both;transition:transform .25s cubic-bezier(.2,1.1,.3,1)}
body:not(.direct) .tile:nth-child(5n+1){grid-column:span 2;aspect-ratio:2.1/1}
.tile:hover{transform:translateY(-4px) rotate(-.6deg)}
.tile:active{transform:scale(.95)}
.tp{display:flex;justify-content:space-between;align-items:flex-start}
.lm{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff;font:800 19px 'Bricolage Grotesque',sans-serif;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 16px -4px var(--a);text-shadow:0 1px 6px rgba(0,0,0,.3)}
.ar{width:32px;height:32px;border-radius:50%;background:var(--gl);border:1px solid var(--ln);display:grid;place-items:center;font-size:15px;transition:transform .25s}
.tile:hover .ar{transform:rotate(45deg)}
.tn b{display:block;font:800 clamp(19px,5.2vw,26px)/1.05 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;overflow-wrap:anywhere}
.tn small{display:block;margin-top:4px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.direct .tile{aspect-ratio:auto;flex-direction:row;align-items:center;gap:12px;border-radius:99px;padding:10px 20px 10px 10px}
.direct .tp{display:block}.direct .ar,.direct .tn small{display:none}
.direct .lm{width:38px;height:38px;border-radius:50%}
.direct .tn b{font-size:18px}
.direct .tile.active{outline:2px solid var(--a);outline-offset:3px}
.sk{aspect-ratio:1/1.02;border-radius:30px;background:linear-gradient(90deg,var(--gl) 25%,var(--ln) 50%,var(--gl) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.empty{grid-column:1/-1;color:var(--mu);text-align:center;padding:30px 0}
.side{display:none}.direct .side{display:block}
#qv{position:relative;padding:12px 12px 18px;text-align:center;border-radius:38px;background:var(--gl);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid color-mix(in srgb,var(--a) 55%,transparent);box-shadow:0 0 80px -12px color-mix(in srgb,var(--a) 55%,transparent)}
.bn{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px;margin-bottom:16px;border-radius:28px;color:#fff;text-align:left;background:linear-gradient(135deg,var(--b),var(--a))}
.bn .lm{width:58px;height:58px;border-radius:50%;font-size:26px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.45);backdrop-filter:blur(6px);box-shadow:none}
.bt{min-width:0;position:relative}
.bt b{display:block;font:800 clamp(24px,7vw,32px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em;text-shadow:0 2px 12px rgba(0,0,0,.3);overflow-wrap:anywhere}
.bt small{display:block;margin-top:5px;font-size:12px;font-weight:600;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.stk{margin-left:auto;font-size:40px;position:relative;filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));animation:wob 3s ease-in-out infinite}
.bub{position:absolute;border-radius:50%;background:rgba(255,255,255,.2);animation:bub 4s ease-in-out infinite alternate}
.bub:nth-child(1){width:90px;height:90px;right:-20px;top:-34px}
.bub:nth-child(2){width:46px;height:46px;left:38%;bottom:-18px;animation-delay:-1.5s}
.bub:nth-child(3){width:26px;height:26px;left:12px;top:8px;animation-delay:-2.5s}
.swap .bn{animation:bnIn .65s cubic-bezier(.2,1.25,.3,1) both}
.swap .bn .lm{animation:spin .8s cubic-bezier(.2,1.3,.3,1) both}
.swap .stk{animation:stkIn .8s cubic-bezier(.2,1.5,.3,1) both,wob 3s .8s ease-in-out infinite}
.qr{position:relative;display:inline-block;width:100%;max-width:330px;padding:20px;border-radius:26px;background:#fff;overflow:hidden;--br:linear-gradient(var(--a),var(--a))}
.direct .qr{max-width:380px}
.qr::before{content:"";position:absolute;inset:8px;border-radius:18px;pointer-events:none;background:var(--br) 0 0/26px 4px,var(--br) 0 0/4px 26px,var(--br) 100% 0/26px 4px,var(--br) 100% 0/4px 26px,var(--br) 0 100%/26px 4px,var(--br) 0 100%/4px 26px,var(--br) 100% 100%/26px 4px,var(--br) 100% 100%/4px 26px;background-repeat:no-repeat}
.qr::after{content:"";position:absolute;left:14px;right:14px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--a),transparent);box-shadow:0 0 14px var(--a);animation:scan 2.4s ease-in-out infinite}
#mi{display:block;width:100%;border-radius:8px;opacity:0;transform:scale(.9);filter:blur(8px);transition:all .5s cubic-bezier(.2,1,.3,1)}
#mi.in{opacity:1;transform:none;filter:none}
.hint{margin-top:14px;font-size:13px;font-weight:500;color:var(--mu)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{flex:1;min-width:90px;padding:13px;border:1px solid var(--ln);border-radius:99px;background:var(--gl);color:var(--tx);font:700 14px 'DM Sans';cursor:pointer;transition:transform .15s}
.row button:active{transform:scale(.94)}.row button:disabled{opacity:.6}
.row .d,.row .r{display:none}.row .d{color:#ff5a5f}
.edit .row .d,.edit .row .r{display:block}
.direct #close{display:none}
.panel{margin-top:22px;padding:18px;background:var(--gl);border:1px solid var(--ln);border-radius:26px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;gap:12px;animation:pop .45s both}
.panel h2{margin:0;font:800 18px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.tg{display:flex;align-items:center;gap:10px;font-size:15px}
.tg input{width:20px;height:20px;accent-color:#c8ff3d}
input[type=text]{padding:14px 18px;border:1px solid var(--ln);border-radius:99px;background:transparent;color:var(--tx);font:inherit;width:100%}
input[type=text]:focus{outline:2px solid var(--ac);border-color:transparent}
input[type=file]{font-size:14px;color:var(--mu);max-width:100%}
button.p{padding:15px;border:0;border-radius:99px;background:var(--ac);color:var(--ink);font:800 16px 'DM Sans';cursor:pointer;transition:transform .15s}
button.p:active{transform:scale(.96)}button.p:disabled{opacity:.6}
.lnk{display:block;margin:26px auto 0;padding:9px 16px;border:1px solid var(--ln);border-radius:99px;background:var(--gl);color:var(--mu);font:500 13px 'DM Sans';cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(5,5,10,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.modal.on{display:flex;animation:fade .25s both}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto;border-radius:38px}
.modal.on .sheet{animation:sheet .55s cubic-bezier(.2,1,.3,1) both}
@media (min-width:700px){.modal{align-items:center}}
.hide{display:none!important}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#07070c;color:#fff;transition:opacity .8s,transform .8s cubic-bezier(.7,0,.2,1),filter .8s,visibility .8s}
#splash.gone{opacity:0;transform:scale(1.25);filter:blur(16px);visibility:hidden}
#splash .au i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 8s ease-in-out infinite alternate}
#splash .au i:nth-child(1){left:-25vmax;top:-20vmax;background:#7b5cff}
#splash .au i:nth-child(2){right:-25vmax;bottom:-25vmax;background:#ff3d81;animation-delay:-3s}
#splash .au i:nth-child(3){left:25%;top:40%;width:40vmax;height:40vmax;background:#c8ff3d;opacity:.22;animation-delay:-5s}
.sp{position:relative;display:grid;justify-items:center;gap:24px;padding:20px}
.pq{display:grid;grid-template:repeat(7,15px)/repeat(7,15px);gap:4px;animation:spinin 1.1s cubic-bezier(.2,1.2,.3,1) both;filter:drop-shadow(0 0 18px rgba(255,61,129,.55))}
.pq b{border-radius:4px;animation:px .5s cubic-bezier(.2,1.5,.3,1) both}
.wm{display:flex;font:800 clamp(52px,17vw,104px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.045em}
.wm span{display:inline-block;color:transparent;background:linear-gradient(110deg,#c8ff3d,#ff3d81,#7b5cff,#3dffd0,#c8ff3d) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;animation:bounce .8s cubic-bezier(.2,1.6,.3,1) both,shine 3s linear infinite;animation-delay:var(--d),0s}
.wm .gap{width:.28em}
.pr{width:min(240px,60vw);height:6px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}
.pr i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#c8ff3d,#ff3d81,#7b5cff);animation:fill 1.7s cubic-bezier(.6,0,.2,1) forwards}
#msg{font:500 14px 'DM Sans';opacity:.75;min-height:20px}
.st{position:absolute;font-size:32px;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes scan{0%,100%{top:14px;opacity:0}15%,85%{opacity:1}50%{top:calc(100% - 17px)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes mq{to{transform:translateX(-100%)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.15)}}
@keyframes bounce{from{transform:translateY(120%) scale(.5);opacity:0}}
@keyframes shine{to{background-position:300% 0}}
@keyframes fill{to{width:100%}}
@keyframes spinin{from{transform:scale(.3) rotate(-140deg);opacity:0}}
@keyframes px{from{transform:scale(0) rotate(90deg);opacity:0}}
@keyframes float{50%{transform:translateY(-16px) rotate(10deg)}}
@keyframes bnIn{from{transform:scale(.8) rotate(-4deg);opacity:0;border-radius:70px}}
@keyframes spin{from{transform:rotate(-200deg) scale(.2);opacity:0}}
@keyframes stkIn{from{transform:scale(0) rotate(-90deg)}}
@keyframes wob{50%{transform:rotate(10deg) translateY(-4px)}}
@keyframes bub{to{transform:translate(8px,-10px) scale(1.15)}}
@media (max-width:700px){
 .direct .wrap{grid-template-columns:1fr}
 .direct .list{display:flex;overflow-x:auto;gap:8px;padding:4px 2px 12px;scrollbar-width:none}
 .direct .tile{flex:none;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div id="splash">
  <div class="au"><i></i><i></i><i></i></div>
  <span class="st" style="left:12%;top:16%">💸</span><span class="st" style="right:12%;top:22%;animation-delay:-1.5s">⚡</span>
  <span class="st" style="left:16%;bottom:18%;animation-delay:-3s">✨</span><span class="st" style="right:14%;bottom:16%;animation-delay:-2s">📱</span>
  <div class="sp">
    <div class="pq" id="pq"></div>
    <div class="wm"><span style="--d:.1s">m</span><span style="--d:.16s">e</span><span style="--d:.22s">r</span><span style="--d:.28s">o</span><span class="gap"></span><span style="--d:.4s">q</span><span style="--d:.46s">r</span></div>
    <div class="pr"><i></i></div>
    <div id="msg">loading the vibes ✨</div>
  </div>
</div>

<main>
  <div class="brand">
    <div class="logo"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></div>
    <span class="bw">mero qr</span>
    <span class="tag">live</span>
  </div>
  <h1><span><em>Scan<u>.</u></em></span><span><em>&amp; pay<u>.</u></em></span></h1>
  <p class="s" id="sub">Apno app chhannus, QR scan garera pay garnus.</p>
  <div class="mq hide" id="mq"></div>

  <div class="wrap">
    <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="side" id="side">
      <div id="qv" class="hide">
        <div class="bn">
          <i class="bub"></i><i class="bub"></i><i class="bub"></i>
          <span class="lm" id="bl"></span>
          <div class="bt"><b id="mt"></b><small id="tg"></small></div>
          <span class="stk" id="stk"></span>
        </div>
        <div class="qr"><img id="mi" alt="QR"></div>
        <div class="hint">Phone ko camera ya app le scan garnus</div>
        <div class="row">
          <button id="close">Banda</button>
          <button class="r" id="rep">Pic replace</button>
          <button class="d" id="del">Delete</button>
        </div>
        <input type="file" id="repfile" accept="image/*" class="hide">
      </div>
    </div>
  </div>

  <div class="panel hide" id="setp">
    <h2>Display setting</h2>
    <label class="tg"><input type="checkbox" id="dmode"> Direct dekhaune (QR sidai side ma, popup bina)</label>
  </div>

  <div class="panel hide" id="addp">
    <h2>Naya QR thapnus</h2>
    <input type="text" id="name" list="sug" placeholder="Name (jastai: eSewa, Nabil Bank)">
    <datalist id="sug"><option>eSewa</option><option>Khalti</option><option>IME Pay</option><option>Fonepay</option><option>Nabil Bank</option><option>NIC Asia</option><option>Global IME Bank</option></datalist>
    <input type="file" id="file" accept="image/*">
    <button class="p" id="save">Save garnus</button>
  </div>

  <button class="lnk" id="toggle">Edit (passcode)</button>
</main>

<div class="modal" id="modal"><div class="sheet" id="boxslot"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://pkbdygfdkeplutnzqjvx.supabase.co';
const SUPABASE_KEY='sb_publishable_tXcS8w9cY6TozitgxxswmA_tPkKXf1p';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let items=[],cur=null,pin=null,mode='popup';
const pub=p=>sb.storage.from('qrs').getPublicUrl(p).data.publicUrl;
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

/* brand themes: [keyword, light color, dark color, sticker] */
const BR=[['esewa','#60bb46','#1f8a3a','💚'],['khalti','#8b4dff','#4a1fb0','💜'],['ime','#ff5a5a','#c4161c','🔥'],['fonepay','#ff3b44','#2a3b8f','⚡'],['nabil','#ff2d55','#8f0019','🔴'],['nic','#2d9bff','#e4002b','💙'],['global','#2f80ff','#0c3f8f','🌐'],['siddhartha','#ff3b3b','#8a1015','🏦'],['connect','#18b6f0','#005b9f','🔷'],['prabhu','#ff7a1a','#c0392b','🧡'],['cellpay','#ffb020','#e0561b','🟠']];
const FB=[['#c8ff3d','#3fa800','✨'],['#c9b6ff','#6a4cff','🔮'],['#ffb98a','#ff6a3d','🍑'],['#8fd8ff','#2f7bff','🫧'],['#ffa6d0','#ff3d81','🌸'],['#8cf0c1','#0fa86c','🍀']];
const HYPE=['scan & go ⚡','instant fr fr','no cap, secure','paisa on the way'];
const hs=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function theme(n){const s=n.toLowerCase();for(const b of BR)if(s.includes(b[0]))return{a:b[1],b:b[2],e:b[3]};const f=FB[hs(s)%FB.length];return{a:f[0],b:f[1],e:f[2]}}
const ini=n=>(n.trim()[0]||'?').toUpperCase();
const kind=n=>/esewa|khalti|ime|fonepay|connect|prabhu|cellpay|pay/i.test(n)?'Digital wallet':'Bank';
const tagline=n=>kind(n)+' · '+HYPE[hs(n.toLowerCase())%HYPE.length];
function tv(el,t){el.style.setProperty('--a',t.a);el.style.setProperty('--b',t.b)}

async function loadMode(){
  const {data}=await sb.rpc('get_view_mode');
  if(data==='direct'||data==='popup')mode=data;
  $('dmode').checked=mode==='direct';
}
async function load(){
  const {data,error}=await sb.from('qrs').select('*').order('created_at');
  if(error){$('list').innerHTML='<div class="empty">Load garna sakiyena: '+error.message+'</div>';return}
  items=data;
  if(cur)cur=items.find(i=>i.id===cur.id)||null;
  render();
}
function marquee(){
  const m=$('mq');m.innerHTML='';
  if(!items.length){m.classList.add('hide');return}
  m.classList.remove('hide');
  const t=items.map(i=>i.name).join('  ✦  ')+'  ✦  ',r=Math.max(2,Math.ceil(90/t.length));
  for(let k=0;k<2;k++){const d=document.createElement('div');d.textContent=t.repeat(r);m.appendChild(d)}
}
function showQr(){
  const direct=mode==='direct',img=$('mi'),q=$('qv'),t=theme(cur.name);
  tv(q,t);
  document.documentElement.style.setProperty('--ga',t.a);
  document.documentElement.style.setProperty('--gb',t.b);
  $('mt').textContent=cur.name;$('bl').textContent=ini(cur.name);
  $('stk').textContent=t.e;$('tg').textContent=tagline(cur.name);
  img.classList.remove('in');
  img.onload=()=>img.classList.add('in');
  img.src=pub(cur.path);
  if(img.complete&&img.naturalWidth)img.classList.add('in');
  (direct?$('side'):$('boxslot')).appendChild(q);
  q.classList.remove('hide','swap');void q.offsetWidth;q.classList.add('swap');
  if(!direct)$('modal').classList.add('on');
}
function render(){
  const direct=mode==='direct';
  document.body.classList.toggle('direct',direct);
  $('sub').textContent=direct?'Left bata chhannus, QR sidai dekhinchha.':'Apno app chhannus, QR scan garera pay garnus.';
  const l=$('list');l.innerHTML='';
  marquee();
  if(direct){if(!cur&&items.length)cur=items[0];$('side').appendChild($('qv'))}
  if(!items.length){l.innerHTML='<div class="empty">Kei QR chhaina.</div>';$('qv').classList.add('hide');return}
  items.forEach((it,i)=>{
    const b=document.createElement('button');
    b.className='tile'+(direct&&cur&&cur.id===it.id?' active':'');
    tv(b,theme(it.name));
    b.style.animationDelay=(i*70)+'ms';
    b.innerHTML='<div class="tp"><span class="lm"></span><span class="ar">↗</span></div><div class="tn"><b></b><small></small></div>';
    b.querySelector('.lm').textContent=ini(it.name);
    b.querySelector('b').textContent=it.name;
    b.querySelector('small').textContent=kind(it.name);
    b.onclick=()=>{
      buzz();cur=it;
      if(mode==='direct')document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x===b));
      showQr();
    };
    l.appendChild(b);
  });
  if(direct&&cur)showQr();else if(direct)$('qv').classList.add('hide');
}
function setEdit(on){
  $('addp').classList.toggle('hide',!on);
  $('setp').classList.toggle('hide',!on);
  document.body.classList.toggle('edit',on);
  $('toggle').textContent=on?'Edit band garnus':'Edit (passcode)';
  if(!on)pin=null;
}
$('toggle').onclick=async()=>{
  if(pin){setEdit(false);return}
  const p=prompt('Passcode halnus:');
  if(!p)return;
  const {data,error}=await sb.rpc('check_pin',{p_pin:p});
  if(error){alert('Error: '+error.message);return}
  if(!data){alert('Passcode galat chha.');return}
  pin=p;setEdit(true);
};
$('dmode').onchange=async()=>{
  const want=$('dmode').checked?'direct':'popup';
  const {error}=await sb.rpc('set_view_mode',{p_pin:pin,p_mode:want});
  if(error){alert(error.message);$('dmode').checked=mode==='direct';return}
  mode=want;cur=null;$('modal').classList.remove('on');render();
};
$('close').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};
$('del').onclick=async()=>{
  if(!cur||!pin||!confirm('Delete garne?'))return;
  const {error}=await sb.rpc('delete_qr',{p_pin:pin,p_id:cur.id});
  if(error){alert(error.message);return}
  cur=null;$('modal').classList.remove('on');load();
};
function shrink(file){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('Image convert bhayena')),'image/jpeg',.9);
    };
    im.onerror=()=>rej(new Error('Image padhna sakiyena'));
    im.src=URL.createObjectURL(file);
  });
}
async function uploadImg(file){
  const blob=await shrink(file),path=crypto.randomUUID()+'.jpg';
  const r=await sb.storage.from('qrs').upload(path,blob,{contentType:'image/jpeg'});
  if(r.error)throw r.error;
  return path;
}
$('save').onclick=async()=>{
  const n=$('name').value.trim(),f=$('file').files[0];
  if(!pin){alert('Pahile passcode halnus.');return}
  if(!n||!f){alert('Name ra QR image duitai chahinchha.');return}
  const btn=$('save');btn.disabled=true;btn.textContent='Upload hudai chha...';
  try{
    const path=await uploadImg(f);
    const r=await sb.rpc('add_qr',{p_pin:pin,p_name:n,p_path:path});
    if(r.error)throw r.error;
    $('name').value='';$('file').value='';load();
  }catch(e){alert('Error: '+e.message)}
  btn.disabled=false;btn.textContent='Save garnus';
};
$('rep').onclick=()=>{if(pin&&cur)$('repfile').click()};
$('repfile').onchange=async()=>{
  const f=$('repfile').files[0];$('repfile').value='';
  if(!f||!pin||!cur)return;
  const btn=$('rep');btn.disabled=true;btn.textContent='Upload hudai chha...';
  try{
    const path=await uploadImg(f);
    const r=await sb.rpc('replace_qr',{p_pin:pin,p_id:cur.id,p_path:path});
    if(r.error)throw r.error;
    cur.path=path;load();
  }catch(e){alert('Error: '+e.message)}
  btn.disabled=false;btn.textContent='Pic replace';
};

/* splash: pixel-QR that builds itself + rotating messages */
(function(){
  const g=$('pq');
  for(let r=0;r<7;r++)for(let c=0;c<7;c++){
    const fr=(r<3&&c<3)||(r<3&&c>3)||(r>3&&c<3);
    let on;
    if(fr){const lr=r%4,lc=c%4;on=!(lr===1&&lc===1)}
    else on=((r*7+c)*37)%5<2;
    const e=document.createElement(on?'b':'span');
    if(on){e.style.background='hsl('+(80+(r+c)*26)+',90%,62%)';e.style.animationDelay=(((r*7+c)*53)%10*.08+.2)+'s'}
    g.appendChild(e);
  }
  const M=['loading the vibes ✨','fetching ur QRs 🔥','almost there 🚀','no cap, just vibes 😮‍💨'];let k=0;
  const iv=setInterval(()=>{k=(k+1)%M.length;$('msg').textContent=M[k]},550);
  window.__stopMsg=()=>clearInterval(iv);
})();

(async()=>{
  const wait=new Promise(r=>setTimeout(r,2000));
  await Promise.all([loadMode().then(load),wait]);
  $('splash').classList.add('gone');
  window.__stopMsg();
})();
</script>
