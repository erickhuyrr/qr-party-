<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070a">
<title>Mero QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--tx:#f5f5f2;--mu:#8f8f9a;--ln:rgba(255,255,255,.13);--gl:rgba(255,255,255,.05);--ac:#d4ff3a;--ink:#0a0a0a;--ga:#5b4bff;--o1:#2b22b8;--o2:#0a6a60;--vg:rgba(0,0,0,.6)}
@media (prefers-color-scheme:light){:root{--bg:#f3f1fb;--tx:#0a0a12;--mu:#6b6a7a;--ln:rgba(10,10,30,.14);--gl:rgba(255,255,255,.65);--o1:#cdc6ff;--o2:#b9eadf;--vg:rgba(255,255,255,0)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:16px 'DM Sans',system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;z-index:60;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(110px)}
.bg i:nth-child(1){width:75vmax;height:75vmax;left:-25vmax;top:-32vmax;background:var(--o1);opacity:.6;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(2){width:65vmax;height:65vmax;right:-28vmax;bottom:-28vmax;background:var(--o2);opacity:.55;animation:drift 26s ease-in-out -8s infinite alternate-reverse}
.bg i:nth-child(3){width:44vmax;height:44vmax;left:28%;top:38%;background:var(--ga);opacity:.22;transition:background-color 1s;animation:drift 30s ease-in-out -14s infinite alternate}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,var(--vg))}
main{max-width:560px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 60px;transition:max-width .5s}
.direct main{max-width:980px}
.mono,.mq,.hint,.kd,.c{font-family:'DM Mono',ui-monospace,monospace}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;animation:pop .6s both}
.logo{width:42px;height:42px;border-radius:13px;border:1px solid var(--ln);background:var(--gl);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;place-content:center}
.logo i{display:grid;grid-template:repeat(3,8px)/repeat(3,8px);gap:2px}
.logo b{border-radius:2px;background:var(--tx)}
.logo b:nth-child(2),.logo b:nth-child(4),.logo b:nth-child(8){opacity:.25}.logo b:nth-child(5){background:var(--ac)}
.bw{font:800 20px 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em}
.tag{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--ln);border-radius:99px;font:500 11px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ac);animation:pulse 1.6s infinite}
h1{font:800 clamp(48px,14vw,88px)/.92 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;margin:4px 0 12px}
h1 span{display:block;overflow:hidden;padding-bottom:.06em}
h1 em{display:block;font-style:normal;animation:rise .9s cubic-bezier(.2,.9,.2,1) both}
h1 span:nth-child(2) em{animation-delay:.12s}
h1 u{text-decoration:none;color:var(--ac)}
.s{color:var(--mu);margin:0 0 18px;max-width:36ch}
.mq{display:flex;overflow:hidden;margin:0 -16px 24px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);white-space:nowrap}
.mq div{flex:none;animation:mq 28s linear infinite}
.wrap{display:block}
.direct .wrap{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.direct .list{grid-template-columns:1fr;gap:10px}
.kd{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.kd i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a);flex:none}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/.9;padding:16px;border-radius:26px;text-align:left;cursor:pointer;font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:pop .6s cubic-bezier(.2,1.1,.3,1) both;transition:transform .25s cubic-bezier(.2,1.1,.3,1),border-color .2s,background .25s}
body:not(.direct) .tile:nth-child(5n+1){grid-column:span 2;aspect-ratio:2.2/1}
.tile:hover{transform:translateY(-4px);border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,var(--gl))}
.tile:active{transform:scale(.96)}
.tp{display:flex;justify-content:space-between;align-items:flex-start}
.ar{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;transition:all .25s}
.tile:hover .ar{background:var(--a);color:#fff;border-color:transparent;transform:rotate(45deg)}
.tn b{display:block;font:800 clamp(22px,6vw,30px)/1.02 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em;overflow-wrap:anywhere}
.direct .tile{aspect-ratio:auto;flex-direction:row;align-items:center;gap:12px;border-radius:99px;padding:15px 22px}
.direct .tp{display:block}.direct .ar,.direct .kd span{display:none}
.direct .tn b{font-size:18px}
.direct .tile.active{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--gl))}
.sk{aspect-ratio:1/.9;border-radius:26px;background:linear-gradient(90deg,var(--gl) 25%,var(--ln) 50%,var(--gl) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
.empty{grid-column:1/-1;color:var(--mu);text-align:center;padding:30px 0}
.side{display:none}.direct .side{display:block}
#qv{text-align:center;padding:4px 0 8px}
.nm{margin:10px 0 20px;font:800 clamp(36px,10vw,56px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.05em;overflow-wrap:anywhere}
.qw{display:inline-block;width:100%;max-width:330px}
.direct .qw{max-width:380px}
.qr{position:relative;padding:20px;border-radius:26px;background:#fff;overflow:hidden;--br:linear-gradient(#0a0a0a,#0a0a0a);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--a) 70%,transparent)}
.qr::before{content:"";position:absolute;inset:8px;border-radius:16px;pointer-events:none;background:var(--br) 0 0/24px 3px,var(--br) 0 0/3px 24px,var(--br) 100% 0/24px 3px,var(--br) 100% 0/3px 24px,var(--br) 0 100%/24px 3px,var(--br) 0 100%/3px 24px,var(--br) 100% 100%/24px 3px,var(--br) 100% 100%/3px 24px;background-repeat:no-repeat}
.qr::after{content:"";position:absolute;left:14px;right:14px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--a),transparent);box-shadow:0 0 14px var(--a);animation:scan 2.4s ease-in-out infinite}
.swap .kd,.swap .nm{animation:up2 .6s cubic-bezier(.2,.9,.2,1) both}
.swap .nm{animation-delay:.06s}
.swap .qr{animation:qrIn .65s cubic-bezier(.2,1.1,.3,1) both}
#mi{display:block;width:100%;border-radius:8px;opacity:0;transform:scale(.92);filter:blur(8px);transition:all .5s cubic-bezier(.2,1,.3,1)}
#mi.in{opacity:1;transform:none;filter:none}
.hint{margin-top:18px;font-size:11.5px;letter-spacing:.04em;color:var(--mu)}
.row{display:flex;gap:8px;margin:16px auto 0;flex-wrap:wrap;max-width:380px}
.row button{flex:1;min-width:90px;padding:13px;border:1px solid var(--ln);border-radius:99px;background:var(--gl);color:var(--tx);font:700 14px 'DM Sans';cursor:pointer;transition:transform .15s,background .2s}
.row button:hover{background:var(--ln)}
.row button:active{transform:scale(.95)}.row button:disabled{opacity:.6}
.row .d,.row .r{display:none}.row .d{color:#ff5a5f}
.edit .row .d,.edit .row .r{display:block}
.direct #close{display:none}
.panel{margin-top:22px;padding:18px;background:var(--gl);border:1px solid var(--ln);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;gap:12px;animation:pop .45s both}
.panel h2{margin:0;font:800 18px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.tg{display:flex;align-items:center;gap:10px;font-size:15px}
.tg input{width:20px;height:20px;accent-color:#d4ff3a}
input[type=text]{padding:14px 18px;border:1px solid var(--ln);border-radius:99px;background:transparent;color:var(--tx);font:inherit;width:100%}
input[type=text]:focus{outline:2px solid var(--ac);border-color:transparent}
input[type=file]{font-size:14px;color:var(--mu);max-width:100%}
button.p{padding:15px;border:0;border-radius:99px;background:var(--ac);color:var(--ink);font:800 16px 'DM Sans';cursor:pointer;transition:transform .15s}
button.p:active{transform:scale(.96)}button.p:disabled{opacity:.6}
.lnk{display:block;margin:26px auto 0;padding:9px 16px;border:1px solid var(--ln);border-radius:99px;background:var(--gl);color:var(--mu);font:500 13px 'DM Sans';cursor:pointer}
.modal{--tx:#f5f5f2;--mu:#b3b3bd;--ln:rgba(255,255,255,.22);--gl:rgba(255,255,255,.08);position:fixed;inset:0;background:rgba(5,5,10,.6);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;align-items:flex-end;justify-content:center;padding:12px 12px 22px;z-index:50;color:var(--tx)}
.modal.on{display:flex;animation:fade .25s both}
.sheet{width:100%;max-width:440px;max-height:100%;overflow:auto}
.modal.on .sheet{animation:sheet .55s cubic-bezier(.2,1,.3,1) both}
@media (min-width:700px){.modal{align-items:center}}
.hide{display:none!important}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#07070a;color:#f5f5f2;transition:transform .95s cubic-bezier(.77,0,.18,1),visibility .95s}
#splash.gone{transform:translateY(-100%);visibility:hidden}
#splash::before{content:"";position:absolute;inset:-10%;background:radial-gradient(60vmax 60vmax at 12% 0%,rgba(59,44,255,.55),transparent 62%),radial-gradient(55vmax 55vmax at 92% 100%,rgba(10,140,125,.5),transparent 62%);animation:drift 9s ease-in-out infinite alternate}
.c{position:absolute;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a9aa6}
.c.tl{left:20px;top:max(20px,env(safe-area-inset-top))}.c.tr{right:20px;top:max(20px,env(safe-area-inset-top));color:#d4ff3a}
.c.bl{left:20px;bottom:max(20px,env(safe-area-inset-bottom))}.c.br{right:20px;bottom:max(20px,env(safe-area-inset-bottom))}
.sp{position:relative;display:grid;justify-items:center;gap:26px;padding:20px}
.pq{display:grid;grid-template:repeat(7,14px)/repeat(7,14px);gap:4px;animation:spinin 1s cubic-bezier(.2,1.2,.3,1) both}
.pq b{border-radius:3px;background:#f5f5f2;animation:px .5s cubic-bezier(.2,1.5,.3,1) both}
.pq b.l{background:#d4ff3a}
.wm{display:flex;overflow:hidden;padding-bottom:.1em;font:800 clamp(56px,19vw,112px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.055em}
.wm i{display:inline-block;font-style:normal;animation:rise .85s cubic-bezier(.2,.9,.2,1) both;animation-delay:var(--d)}
.wm .gap{width:.26em}
.pr{width:min(260px,64vw);height:2px;background:rgba(255,255,255,.18);overflow:hidden}
.pr i{display:block;height:100%;width:0;background:#d4ff3a;animation:fill 1.9s cubic-bezier(.6,0,.2,1) forwards}
#msg{font:400 12px 'DM Mono',monospace;letter-spacing:.08em;color:#9a9aa6;min-height:18px}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
@keyframes up2{from{transform:translateY(14px);opacity:0}}
@keyframes qrIn{from{opacity:0;transform:translateY(20px) scale(.92)}}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes scan{0%,100%{top:14px;opacity:0}15%,85%{opacity:1}50%{top:calc(100% - 17px)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes mq{to{transform:translateX(-100%)}}
@keyframes pulse{50%{opacity:.3}}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
@keyframes fill{to{width:100%}}
@keyframes spinin{from{transform:scale(.4) rotate(-90deg);opacity:0}}
@keyframes px{from{transform:scale(0);opacity:0}}
@media (max-width:700px){
 .direct .wrap{grid-template-columns:1fr}
 .direct .list{display:flex;overflow-x:auto;gap:8px;padding:4px 2px 12px;scrollbar-width:none}
 .direct .tile{flex:none;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>

<div id="splash">
  <span class="c tl">mero qr</span><span class="c tr" id="pc">000</span>
  <span class="c bl">scan / pay / repeat</span><span class="c br">2026</span>
  <div class="sp">
    <div class="pq" id="pq"></div>
    <div class="wm"><i style="--d:.1s">m</i><i style="--d:.16s">e</i><i style="--d:.22s">r</i><i style="--d:.28s">o</i><i class="gap"></i><i style="--d:.4s">q</i><i style="--d:.46s">r</i></div>
    <div class="pr"><i></i></div>
    <div id="msg">loading the vibes</div>
  </div>
</div>

<main>
  <div class="brand">
    <div class="logo"><i><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></i></div>
    <span class="bw">mero qr</span>
    <span class="tag">live</span>
  </div>
  <h1><span><em>Scan<u>.</u></em></span><span><em>&amp; pay<u>.</u></em></span></h1>
  <p class="s" id="sub">Apno app chhannus, QR scan garera pay garnus.</p>
  <div class="mq hide" id="mq"></div>

  <div class="wrap">
    <div class="list" id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div class="side" id="side">
      <div id="qv" class="hide">
        <div class="kd"><i></i><span id="kt"></span></div>
        <h3 class="nm" id="mt"></h3>
        <div class="qw"><div class="qr"><img id="mi" alt="QR"></div></div>
        <div class="hint">Phone ko camera ya app le scan garnus</div>
        <div class="row">
          <button id="close">Banda</button>
          <button class="r" id="rep">Pic replace</button>
          <button class="d" id="del">Delete</button>
        </div>
        <input type="file" id="repfile" accept="image/*" class="hide">
      </div>
    </div>
  </div>

  <div class="panel hide" id="setp">
    <h2>Display setting</h2>
    <label class="tg"><input type="checkbox" id="dmode"> Direct dekhaune (QR sidai side ma, popup bina)</label>
  </div>

  <div class="panel hide" id="addp">
    <h2>Naya QR thapnus</h2>
    <input type="text" id="name" list="sug" placeholder="Name (jastai: eSewa, Nabil Bank)">
    <datalist id="sug"><option>eSewa</option><option>Khalti</option><option>IME Pay</option><option>Fonepay</option><option>Nabil Bank</option><option>NIC Asia</option><option>Global IME Bank</option></datalist>
    <input type="file" id="file" accept="image/*">
    <button class="p" id="save">Save garnus</button>
  </div>

  <button class="lnk" id="toggle">Edit (passcode)</button>
</main>

<div class="modal" id="modal"><div class="sheet" id="boxslot"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL='https://pkbdygfdkeplutnzqjvx.supabase.co';
const SUPABASE_KEY='sb_publishable_tXcS8w9cY6TozitgxxswmA_tPkKXf1p';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let items=[],cur=null,pin=null,mode='popup';
const pub=p=>sb.storage.from('qrs').getPublicUrl(p).data.publicUrl;
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
const ARR='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M8 7h9v9"/></svg>';

/* brand colors: [keyword, color] */
const BR=[['esewa','#60bb46'],['khalti','#7a3fd1'],['ime','#e1251b'],['fonepay','#e31b23'],['nabil','#d71920'],['nic','#e4002b'],['global','#2f6bff'],['siddhartha','#c8102e'],['connect','#00a3e0'],['prabhu','#f37021'],['cellpay','#f5a623']];
const FB=['#d4ff3a','#ff6a3d','#4d7cff','#b28cff','#00d1a0','#ff4d8d'];
const hs=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function theme(n){const s=n.toLowerCase();for(const b of BR)if(s.includes(b[0]))return b[1];return FB[hs(s)%FB.length]}
const kind=n=>/esewa|khalti|ime|fonepay|connect|prabhu|cellpay|pay/i.test(n)?'Wallet':'Bank';

async function loadMode(){
  const {data}=await sb.rpc('get_view_mode');
  if(data==='direct'||data==='popup')mode=data;
  $('dmode').checked=mode==='direct';
}
async function load(){
  const {data,error}=await sb.from('qrs').select('*').order('created_at');
  if(error){$('list').innerHTML='<div class="empty">Load garna sakiyena: '+error.message+'</div>';return}
  items=data;
  if(cur)cur=items.find(i=>i.id===cur.id)||null;
  render();
}
function marquee(){
  const m=$('mq');m.innerHTML='';
  if(!items.length){m.classList.add('hide');return}
  m.classList.remove('hide');
  const t=items.map(i=>i.name).join('  /  ')+'  /  ',r=Math.max(2,Math.ceil(90/t.length));
  for(let k=0;k<2;k++){const d=document.createElement('div');d.textContent=t.repeat(r);m.appendChild(d)}
}
function showQr(){
  const direct=mode==='direct',img=$('mi'),q=$('qv'),c=theme(cur.name);
  q.style.setProperty('--a',c);
  document.documentElement.style.setProperty('--ga',c);
  $('mt').textContent=cur.name;$('kt').textContent=kind(cur.name);
  img.classList.remove('in');
  img.onload=()=>img.classList.add('in');
  img.src=pub(cur.path);
  if(img.complete&&img.naturalWidth)img.classList.add('in');
  (direct?$('side'):$('boxslot')).appendChild(q);
  q.classList.remove('hide','swap');void q.offsetWidth;q.classList.add('swap');
  if(!direct)$('modal').classList.add('on');
}
function render(){
  const direct=mode==='direct';
  document.body.classList.toggle('direct',direct);
  $('sub').textContent=direct?'Left bata chhannus, QR sidai dekhinchha.':'Apno app chhannus, QR scan garera pay garnus.';
  const l=$('list');l.innerHTML='';
  marquee();
  if(direct){if(!cur&&items.length)cur=items[0];$('side').appendChild($('qv'))}
  if(!items.length){l.innerHTML='<div class="empty">Kei QR chhaina.</div>';$('qv').classList.add('hide');return}
  items.forEach((it,i)=>{
    const b=document.createElement('button');
    b.className='tile'+(direct&&cur&&cur.id===it.id?' active':'');
    b.style.setProperty('--a',theme(it.name));
    b.style.animationDelay=(i*70)+'ms';
    b.innerHTML='<div class="tp"><span class="kd"><i></i><span></span></span><span class="ar">'+ARR+'</span></div><div class="tn"><b></b></div>';
    b.querySelector('.kd span').textContent=kind(it.name);
    b.querySelector('b').textContent=it.name;
    b.onclick=()=>{
      buzz();cur=it;
      if(mode==='direct')document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x===b));
      showQr();
    };
    l.appendChild(b);
  });
  if(direct&&cur)showQr();else if(direct)$('qv').classList.add('hide');
}
function setEdit(on){
  $('addp').classList.toggle('hide',!on);
  $('setp').classList.toggle('hide',!on);
  document.body.classList.toggle('edit',on);
  $('toggle').textContent=on?'Edit band garnus':'Edit (passcode)';
  if(!on)pin=null;
}
$('toggle').onclick=async()=>{
  if(pin){setEdit(false);return}
  const p=prompt('Passcode halnus:');
  if(!p)return;
  const {data,error}=await sb.rpc('check_pin',{p_pin:p});
  if(error){alert('Error: '+error.message);return}
  if(!data){alert('Passcode galat chha.');return}
  pin=p;setEdit(true);
};
$('dmode').onchange=async()=>{
  const want=$('dmode').checked?'direct':'popup';
  const {error}=await sb.rpc('set_view_mode',{p_pin:pin,p_mode:want});
  if(error){alert(error.message);$('dmode').checked=mode==='direct';return}
  mode=want;cur=null;$('modal').classList.remove('on');render();
};
$('close').onclick=()=>$('modal').classList.remove('on');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('on')};
$('del').onclick=async()=>{
  if(!cur||!pin||!confirm('Delete garne?'))return;
  const {error}=await sb.rpc('delete_qr',{p_pin:pin,p_id:cur.id});
  if(error){alert(error.message);return}
  cur=null;$('modal').classList.remove('on');load();
};
function shrink(file){
  return new Promise((res,rej)=>{
    const im=new Image();
    im.onload=()=>{
      const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      c.toBlob(b=>b?res(b):rej(new Error('Image convert bhayena')),'image/jpeg',.9);
    };
    im.onerror=()=>rej(new Error('Image padhna sakiyena'));
    im.src=URL.createObjectURL(file);
  });
}
async function uploadImg(file){
  const blob=await shrink(file),path=crypto.randomUUID()+'.jpg';
  const r=await sb.storage.from('qrs').upload(path,blob,{contentType:'image/jpeg'});
  if(r.error)throw r.error;
  return path;
}
$('save').onclick=async()=>{
  const n=$('name').value.trim(),f=$('file').files[0];
  if(!pin){alert('Pahile passcode halnus.');return}
  if(!n||!f){alert('Name ra QR image duitai chahinchha.');return}
  const btn=$('save');btn.disabled=true;btn.textContent='Upload hudai chha...';
  try{
    const path=await uploadImg(f);
    const r=await sb.rpc('add_qr',{p_pin:pin,p_name:n,p_path:path});
    if(r.error)throw r.error;
    $('name').value='';$('file').value='';load();
  }catch(e){alert('Error: '+e.message)}
  btn.disabled=false;btn.textContent='Save garnus';
};
$('rep').onclick=()=>{if(pin&&cur)$('repfile').click()};
$('repfile').onchange=async()=>{
  const f=$('repfile').files[0];$('repfile').value='';
  if(!f||!pin||!cur)return;
  const btn=$('rep');btn.disabled=true;btn.textContent='Upload hudai chha...';
  try{
    const path=await uploadImg(f);
    const r=await sb.rpc('replace_qr',{p_pin:pin,p_id:cur.id,p_path:path});
    if(r.error)throw r.error;
    cur.path=path;load();
  }catch(e){alert('Error: '+e.message)}
  btn.disabled=false;btn.textContent='Pic replace';
};

/* splash: pixel QR builds itself, counter, rotating text */
(function(){
  const g=$('pq');
  for(let r=0;r<7;r++)for(let c=0;c<7;c++){
    const fr=(r<3&&c<3)||(r<3&&c>3)||(r>3&&c<3);
    const on=fr?!((r%4)===1&&(c%4)===1):((r*7+c)*37)%5<2;
    const e=document.createElement(on?'b':'span');
    if(on){e.style.animationDelay=(((r*7+c)*53)%10*.08+.2)+'s';if((r*7+c)%6===0)e.className='l'}
    g.appendChild(e);
  }
  const M=['loading the vibes','fetching ur QRs','almost there','no cap, just vibes'];let k=0;
  const iv=setInterval(()=>{k=(k+1)%M.length;$('msg').textContent=M[k]},550);
  const t0=performance.now();let raf;
  (function tick(t){const p=Math.min(100,Math.round((t-t0)/20));$('pc').textContent=String(p).padStart(3,'0');if(p<100)raf=requestAnimationFrame(tick)})(t0);
  window.__stop=()=>{clearInterval(iv);cancelAnimationFrame(raf);$('pc').textContent='100'};
})();

(async()=>{
  const wait=new Promise(r=>setTimeout(r,2000));
  await Promise.all([loadMode().then(load),wait]);
  window.__stop();
  $('splash').classList.add('gone');
})();
</script>
